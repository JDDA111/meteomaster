<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFS forecast evolution animator</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff;
    --ok: #3fb950; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 1.5rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 1rem; }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 1rem; line-height: 1.6; }
  .meta code { background: var(--panel); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .viewer { position: relative; background: var(--panel); border: 1px solid var(--border);
            border-radius: 8px; overflow: hidden; min-height: 400px;
            display: flex; align-items: center; justify-content: center;
            cursor: crosshair; }
  .viewer img { max-width: 100%; height: auto; display: block; }
  .overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.75);
             padding: 6px 10px; border-radius: 6px; font-family: ui-monospace, monospace;
             font-size: 12px; pointer-events: none; }
  .marker { position: absolute; width: 14px; height: 14px; border: 2px solid #ffd33d;
            border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.6), 0 0 8px rgba(255,211,61,0.6); }
  .controls { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
  .controls input[type=range] { flex: 1; min-width: 150px; }
  .controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border);
                     padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
                     min-width: 90px; }
  .controls button:hover { border-color: var(--accent); }
  .controls button:disabled { opacity: 0.5; cursor: not-allowed; }
  .readout { font-family: ui-monospace, monospace; font-size: 13px; min-width: 70px; text-align: right; }
  details { margin-top: 1rem; font-size: 12px; color: var(--muted); }
  details pre { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
                padding: 10px; max-height: 300px; overflow: auto; font-size: 11px; line-height: 1.5; }
  .err { color: var(--err); }
  .ok { color: var(--ok); }

  .chart-card { margin-top: 1rem; background: var(--panel); border: 1px solid var(--border);
                border-radius: 8px; padding: 1rem; }
  .chart-head { display: flex; justify-content: space-between; align-items: center;
                margin-bottom: 8px; font-size: 13px; }
  .chart-head .info { font-family: ui-monospace, monospace; color: var(--muted); }
  .chart-head .legend { display: flex; gap: 12px; font-size: 12px; }
  .chart-head .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px;
                        vertical-align: middle; margin-right: 4px; }
  #chart { width: 100%; height: 320px; display: block; }
  .chart-axis { stroke: var(--muted); stroke-width: 1; }
  .chart-tick { stroke: var(--muted); stroke-width: 1; }
  .chart-grid { stroke: var(--border); stroke-width: 0.5; stroke-dasharray: 2,3; opacity: 0.7; }
  .chart-line { stroke: #58a6ff; stroke-width: 1.8; fill: none; stroke-linejoin: round; stroke-linecap: round; }
  .chart-area { fill: rgba(88,166,255,0.12); stroke: none; }
  .chart-trend { stroke: #ffa657; stroke-width: 1.6; stroke-dasharray: 6,4; opacity: 0.95; }
  .chart-dot { fill: #58a6ff; stroke: #0e1116; stroke-width: 1; }
  .chart-label { fill: var(--muted); font-size: 10px; font-family: ui-monospace, monospace; }
  .chart-label-strong { fill: var(--text); font-weight: 600; }
  .chart-axis-title { fill: var(--text); font-size: 11px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .chart-current { stroke: #ffd33d; stroke-width: 1.2; stroke-dasharray: 3,3; opacity: 0.85; }
  .chart-today { stroke: #f85149; stroke-width: 1; stroke-dasharray: 5,3; opacity: 0.85; }
  .chart-today-label { fill: #f85149; font-weight: 600; font-size: 10px; }
  .hint { color: var(--muted); font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<h1>GFS forecast evolution animator</h1>
<div id="meta" class="meta">Cargando manifest...</div>

<div class="viewer" id="viewer">
  <img id="map" alt="Mapa GFS">
  <div id="overlay" class="overlay"></div>
  <div id="marker" class="marker" hidden></div>
</div>

<div class="controls">
  <button id="play">Play</button>
  <input type="range" id="slider" min="0" max="0" value="0" step="1">
  <span class="readout" id="readout">0 / 0</span>
</div>

<div class="controls">
  <span style="font-size: 13px; color: var(--muted);">Velocidad</span>
  <input type="range" id="speed" min="100" max="2000" value="500" step="50">
  <span class="readout" id="speed-readout">500 ms</span>
  <button id="clearPoint" disabled>Quitar punto</button>
</div>

<div class="chart-card" id="chartCard" hidden>
  <div class="chart-head">
    <div class="info" id="pointInfo"></div>
    <div class="legend" id="chartLegend"></div>
  </div>
  <svg id="chart" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="hint" id="chartHint"></div>
</div>

<p id="clickHint" class="hint">Haz click en el mapa para ver la evolucion del valor en ese punto.</p>

<details>
  <summary style="cursor: pointer;">Log de descarga</summary>
  <pre id="log">Cargando...</pre>
</details>

<script>
(async function() {
  const meta = document.getElementById('meta');
  const map = document.getElementById('map');
  const viewer = document.getElementById('viewer');
  const overlay = document.getElementById('overlay');
  const marker = document.getElementById('marker');
  const slider = document.getElementById('slider');
  const readout = document.getElementById('readout');
  const playBtn = document.getElementById('play');
  const speedEl = document.getElementById('speed');
  const speedReadout = document.getElementById('speed-readout');
  const logEl = document.getElementById('log');
  const chartCard = document.getElementById('chartCard');
  const chartEl = document.getElementById('chart');
  const chartLegend = document.getElementById('chartLegend');
  const pointInfo = document.getElementById('pointInfo');
  const chartHint = document.getElementById('chartHint');
  const clickHint = document.getElementById('clickHint');
  const clearBtn = document.getElementById('clearPoint');

  let frames = [], idx = 0, playing = false, timer = null, mapParam = '';
  let pickedRatio = null;
  let imgCache = new Map();
  let colorbar = null;

  // Configuracion de campo + rango de la barra de colores por map_param.
  // vmin/vmax = valores numericos en los extremos izquierdo y derecho de la barra.
  // Si los valores absolutos no cuadran, ajusta aqui los limites.
  const MAP_INFO = {
    'gfs-0':  { field: 'Z500',          unit: 'dam', vmin: 480,  vmax: 600 },
    'gfs-1':  { field: 'Precipitacion', unit: 'mm',  vmin: 0,    vmax: 250 },
    'gfs-2':  { field: 'T 850hPa',      unit: 'C',   vmin: -40,  vmax: 30  },
    'gfs-3':  { field: 'T 2m',          unit: 'C',   vmin: -40,  vmax: 40  },
  };
  const DEFAULT_INFO = { field: 'valor', unit: '', vmin: 0, vmax: 1 };

  const SAMPLE_RADIUS = 2;          // 5x5 = (2*r+1)^2
  const WHITE_THRESH = 240;         // pixel "blanco" si todos los canales > umbral

  function isWhite(r, g, b) {
    return r >= WHITE_THRESH && g >= WHITE_THRESH && b >= WHITE_THRESH;
  }
  function isBlack(r, g, b) {
    return r < 30 && g < 30 && b < 30;
  }

  function loadFrame(file) {
    if (imgCache.has(file)) return imgCache.get(file);
    const p = new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = () => reject(new Error('load failed: ' + file));
      img.src = 'frames/' + file;
    });
    imgCache.set(file, p);
    return p;
  }

  // Detecta una banda horizontal continua de colores variados en la parte
  // baja de la imagen (la barra de la leyenda) y devuelve una LUT con
  // muestras (r, g, b, t) donde t es la posicion normalizada [0, 1].
  async function buildColorbar() {
    if (!frames.length) return null;
    const img = await loadFrame(frames[0].file);
    const w = img.naturalWidth, h = img.naturalHeight;
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const data = ctx.getImageData(0, 0, w, h).data;

    // Buscar la fila con mas variedad de color en el 25% inferior.
    const startY = Math.floor(h * 0.75);
    let bestRow = -1, bestVariety = 0;
    for (let y = startY; y < h; y++) {
      const seen = new Set();
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        if (isWhite(r,g,b) || isBlack(r,g,b)) continue;
        seen.add(((r>>3)<<10) | ((g>>3)<<5) | (b>>3));
      }
      if (seen.size > bestVariety) {
        bestVariety = seen.size;
        bestRow = y;
      }
    }
    if (bestRow < 0 || bestVariety < 8) return null;

    // Bordes izq/der de la barra: extremos no blancos en esa fila.
    let left = -1, right = -1;
    for (let x = 0; x < w; x++) {
      const i = (bestRow * w + x) * 4;
      const r = data[i], g = data[i+1], b = data[i+2];
      if (!isWhite(r,g,b) && !isBlack(r,g,b)) {
        if (left < 0) left = x;
        right = x;
      }
    }
    if (right - left < 50) return null;

    // Promedio vertical de 3 filas para reducir ruido.
    const samples = [];
    for (let x = left; x <= right; x++) {
      let R = 0, G = 0, B = 0, n = 0;
      for (let dy = -1; dy <= 1; dy++) {
        const y = bestRow + dy;
        if (y < 0 || y >= h) continue;
        const i = (y * w + x) * 4;
        const r = data[i], g = data[i+1], b = data[i+2];
        if (isWhite(r,g,b) || isBlack(r,g,b)) continue;
        R += r; G += g; B += b; n++;
      }
      if (n > 0) {
        samples.push({
          r: R/n, g: G/n, b: B/n,
          t: (x - left) / (right - left),
        });
      }
    }
    if (samples.length < 20) return null;
    return { y: bestRow, left, right, samples };
  }

  // Encuentra el color mas cercano en la LUT y devuelve su valor interpolado.
  function pixelToValue(r, g, b, info) {
    if (!colorbar) return null;
    let bestDist = Infinity, bestT = 0;
    for (const s of colorbar.samples) {
      const d = (s.r-r)**2 + (s.g-g)**2 + (s.b-b)**2;
      if (d < bestDist) { bestDist = d; bestT = s.t; }
    }
    return {
      value: info.vmin + bestT * (info.vmax - info.vmin),
      dist: Math.sqrt(bestDist),
    };
  }

  // Muestrea un parche 5x5, descarta blancos y promedia el valor.
  async function sampleAtPoint(xRatio, yRatio) {
    const info = MAP_INFO[mapParam] || DEFAULT_INFO;
    const tasks = frames.map(async (f) => {
      try {
        const img = await loadFrame(f.file);
        const w = img.naturalWidth, h = img.naturalHeight;
        const cx = Math.round(xRatio * w);
        const cy = Math.round(yRatio * h);
        const x0 = Math.max(0, cx - SAMPLE_RADIUS);
        const y0 = Math.max(0, cy - SAMPLE_RADIUS);
        const x1 = Math.min(w - 1, cx + SAMPLE_RADIUS);
        const y1 = Math.min(h - 1, cy + SAMPLE_RADIUS);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const ctx = c.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const patch = ctx.getImageData(x0, y0, x1-x0+1, y1-y0+1).data;

        const values = [];
        let maxDist = 0;
        for (let i = 0; i < patch.length; i += 4) {
          const r = patch[i], g = patch[i+1], b = patch[i+2];
          if (isWhite(r, g, b) || isBlack(r, g, b)) continue;
          const v = pixelToValue(r, g, b, info);
          if (v == null) continue;
          values.push(v.value);
          if (v.dist > maxDist) maxDist = v.dist;
        }

        if (!values.length) return { frame: f, value: null, count: 0 };
        const avg = values.reduce((a, b) => a + b, 0) / values.length;
        return { frame: f, value: avg, count: values.length, maxDist };
      } catch (e) {
        return { frame: f, value: null, count: 0 };
      }
    });
    return Promise.all(tasks);
  }

  function niceTicks(min, max, target) {
    const span = max - min;
    if (span <= 0) return { step: 1, ticks: [min] };
    const rough = span / target;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const start = Math.ceil(min / step) * step;
    const ticks = [];
    for (let v = start; v <= max + 1e-9; v += step) ticks.push(v);
    return { step, ticks };
  }

  function linreg(pts) {
    const n = pts.length;
    let sx=0, sy=0, sxx=0, sxy=0;
    for (const [x,y] of pts) { sx+=x; sy+=y; sxx+=x*x; sxy+=x*y; }
    const denom = n*sxx - sx*sx;
    if (!denom) return null;
    const slope = (n*sxy - sx*sy) / denom;
    const intercept = (sy - slope*sx) / n;
    return { slope, intercept };
  }

  function renderChart(samples) {
    const info = MAP_INFO[mapParam] || DEFAULT_INFO;
    chartLegend.innerHTML = '';
    chartHint.textContent = '';

    const W = 900, H = 320, padL = 64, padR = 24, padT = 18, padB = 52;
    const innerW = W - padL - padR, innerH = H - padT - padB;
    const n = samples.length;
    if (!n) { chartEl.innerHTML = ''; return; }

    const valid = samples.filter(s => s.value != null);
    if (!valid.length) {
      chartEl.innerHTML = '';
      chartHint.textContent = 'Todos los pixeles del parche eran blancos/negros. Prueba un punto distinto.';
      return;
    }

    const points = samples.map(s => ({ t: new Date(s.frame.run).getTime(), v: s.value, raw: s }));
    const validPts = points.filter(p => p.v != null);
    const tMin = points[0].t;
    const tMaxData = points[points.length-1].t;
    const today = Date.now();
    const tMax = Math.max(tMaxData, today);

    const reg = validPts.length >= 2
      ? linreg(validPts.map(p => [p.t, p.v]))
      : null;

    let yMin = Math.min(...validPts.map(p => p.v));
    let yMax = Math.max(...validPts.map(p => p.v));
    if (reg) {
      yMin = Math.min(yMin, reg.slope*tMin + reg.intercept, reg.slope*tMax + reg.intercept);
      yMax = Math.max(yMax, reg.slope*tMin + reg.intercept, reg.slope*tMax + reg.intercept);
    }
    const yPad = (yMax - yMin || 1) * 0.08;
    yMin -= yPad; yMax += yPad;

    const yT = niceTicks(yMin, yMax, 8);
    yMin = Math.min(yMin, yT.ticks[0]);
    yMax = Math.max(yMax, yT.ticks[yT.ticks.length-1]);

    const xAt = t => padL + ((t - tMin) / (tMax - tMin || 1)) * innerW;
    const yAt = v => padT + innerH - ((v - yMin) / (yMax - yMin || 1)) * innerH;

    const dayMs = 24 * 3600 * 1000;
    const totalDays = (tMax - tMin) / dayMs;
    const tickStepHours = totalDays > 18 ? 48 : totalDays > 9 ? 24 : totalDays > 4 ? 12 : 6;
    const tickStepMs = tickStepHours * 3600 * 1000;
    const startTick = Math.ceil(tMin / tickStepMs) * tickStepMs;

    const decimals = yT.step >= 10 ? 0 : yT.step >= 1 ? 1 : 2;
    const fmtY = v => v.toFixed(decimals);

    let svg = '';

    // Y grid + labels
    yT.ticks.forEach(v => {
      const y = yAt(v);
      svg += `<line class="chart-grid" x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}"/>`;
      svg += `<text class="chart-label" x="${padL-8}" y="${y+3}" text-anchor="end">${fmtY(v)}</text>`;
    });

    // Y axis title
    svg += `<text class="chart-axis-title" x="16" y="${padT+innerH/2}" transform="rotate(-90 16 ${padT+innerH/2})" text-anchor="middle">${info.field} (${info.unit})</text>`;

    // X grid + labels (multi-fila: dia/mes y hora)
    const padN = x => String(x).padStart(2,'0');
    let lastDay = '';
    for (let t = startTick; t <= tMax + 1e-3; t += tickStepMs) {
      const x = xAt(t);
      const d = new Date(t);
      svg += `<line class="chart-grid" x1="${x}" y1="${padT}" x2="${x}" y2="${padT+innerH}"/>`;
      svg += `<line class="chart-tick" x1="${x}" y1="${padT+innerH}" x2="${x}" y2="${padT+innerH+4}"/>`;
      const isMidnight = d.getUTCHours() === 0;
      const dayLbl = `${padN(d.getUTCDate())}/${padN(d.getUTCMonth()+1)}`;
      const hourLbl = `${padN(d.getUTCHours())}Z`;
      if (isMidnight || tickStepHours >= 24) {
        if (dayLbl !== lastDay) {
          svg += `<text class="chart-label chart-label-strong" x="${x}" y="${H-padB+14}" text-anchor="middle">${dayLbl}</text>`;
          lastDay = dayLbl;
        } else {
          svg += `<text class="chart-label" x="${x}" y="${H-padB+14}" text-anchor="middle">${hourLbl}</text>`;
        }
      } else {
        svg += `<text class="chart-label" x="${x}" y="${H-padB+14}" text-anchor="middle">${hourLbl}</text>`;
        if (dayLbl !== lastDay) {
          svg += `<text class="chart-label chart-label-strong" x="${x}" y="${H-padB+28}" text-anchor="middle">${dayLbl}</text>`;
          lastDay = dayLbl;
        }
      }
    }

    // Marcador "hoy"
    const xToday = xAt(today);
    svg += `<line class="chart-today" x1="${xToday}" y1="${padT}" x2="${xToday}" y2="${padT+innerH}"/>`;
    svg += `<text class="chart-label chart-today-label" x="${xToday}" y="${padT-5}" text-anchor="middle">hoy</text>`;

    // Marcador frame actual
    const curT = points[idx] ? points[idx].t : tMin;
    svg += `<line class="chart-current" x1="${xAt(curT)}" y1="${padT}" x2="${xAt(curT)}" y2="${padT+innerH}"/>`;

    // Area bajo la curva
    let areaPath = '';
    let segStart = null;
    points.forEach((p, i) => {
      if (p.v == null) {
        if (segStart != null) {
          const last = points[i-1];
          areaPath += `L${xAt(last.t)},${yAt(yMin)} L${xAt(segStart)},${yAt(yMin)} Z `;
          segStart = null;
        }
        return;
      }
      if (segStart == null) {
        areaPath += `M${xAt(p.t)},${yAt(p.v)} `;
        segStart = p.t;
      } else {
        areaPath += `L${xAt(p.t)},${yAt(p.v)} `;
      }
      if (i === points.length-1 && segStart != null) {
        areaPath += `L${xAt(p.t)},${yAt(yMin)} L${xAt(segStart)},${yAt(yMin)} Z `;
      }
    });
    if (areaPath) svg += `<path class="chart-area" d="${areaPath}"/>`;

    // Linea de tendencia (extendida hasta hoy)
    if (reg) {
      const yA = reg.slope*tMin + reg.intercept;
      const yB = reg.slope*tMax + reg.intercept;
      svg += `<line class="chart-trend" x1="${xAt(tMin)}" y1="${yAt(yA)}" x2="${xAt(tMax)}" y2="${yAt(yB)}"/>`;
    }

    // Linea de valores
    let pathD = '', penDown = false;
    points.forEach(p => {
      if (p.v == null) { penDown = false; return; }
      pathD += (penDown ? 'L' : 'M') + xAt(p.t) + ',' + yAt(p.v) + ' ';
      penDown = true;
    });
    svg += `<path class="chart-line" d="${pathD}"/>`;

    // Puntos
    points.forEach(p => {
      if (p.v == null) return;
      svg += `<circle class="chart-dot" cx="${xAt(p.t)}" cy="${yAt(p.v)}" r="3"/>`;
    });

    // Ejes
    svg += `<line class="chart-axis" x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+innerH}"/>`;
    svg += `<line class="chart-axis" x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}"/>`;

    chartEl.innerHTML = svg;

    // Leyenda
    chartLegend.innerHTML = `
      <span><span class="swatch" style="background:#58a6ff"></span>${info.field} (${info.unit})</span>
      ${reg ? '<span><span class="swatch" style="background:#ffa657"></span>Tendencia</span>' : ''}
      <span><span class="swatch" style="background:#f85149"></span>Hoy</span>
    `;

    const avgCount = (samples.reduce((a, s) => a + (s.count||0), 0) / n).toFixed(1);
    let trendTxt = '';
    if (reg) {
      const perDay = reg.slope * dayMs;
      const sign = perDay >= 0 ? '+' : '';
      trendTxt = `Tendencia: ${sign}${perDay.toFixed(2)} ${info.unit}/dia.`;
    }
    chartHint.textContent = `Parche 5x5, blancos y negros descartados (~${avgCount} px utiles/frame). ` +
      `Rango LUT: ${info.vmin}-${info.vmax} ${info.unit}. ${trendTxt}`;
  }

  let lastSamples = null;
  async function pickPoint(xRatio, yRatio) {
    pickedRatio = { x: xRatio, y: yRatio };
    updateMarker();
    clearBtn.disabled = false;
    clickHint.hidden = true;
    chartCard.hidden = false;
    if (!colorbar) {
      pointInfo.textContent = 'Detectando barra de colores...';
      try {
        colorbar = await buildColorbar();
      } catch (e) {
        colorbar = null;
      }
      if (!colorbar) {
        pointInfo.textContent = 'No se ha podido detectar la barra de colores en la imagen.';
        return;
      }
    }
    pointInfo.textContent = `Muestreando ${frames.length} frames...`;
    chartEl.innerHTML = '';
    try {
      const samples = await sampleAtPoint(xRatio, yRatio);
      lastSamples = samples;
      pointInfo.textContent = `Punto (${(xRatio*100).toFixed(1)}%, ${(yRatio*100).toFixed(1)}%) · ${samples.length} muestras`;
      renderChart(samples);
    } catch (e) {
      pointInfo.textContent = 'Error: ' + e.message;
    }
  }

  function updateMarker() {
    if (!pickedRatio) { marker.hidden = true; return; }
    const r = map.getBoundingClientRect();
    const v = viewer.getBoundingClientRect();
    marker.style.left = (r.left - v.left + pickedRatio.x * r.width) + 'px';
    marker.style.top = (r.top - v.top + pickedRatio.y * r.height) + 'px';
    marker.hidden = false;
  }

  function clearPick() {
    pickedRatio = null;
    lastSamples = null;
    marker.hidden = true;
    chartCard.hidden = true;
    clearBtn.disabled = true;
    clickHint.hidden = false;
  }

  try {
    const r = await fetch('frames/manifest.json');
    const manifest = await r.json();
    frames = manifest.frames || [];
    mapParam = manifest.map_param || '';
    const s = manifest.stats || {};
    meta.innerHTML = `
      Objetivo: <code>${manifest.target_date} ${String(manifest.target_hour).padStart(2,'0')}Z</code> ·
      Mapa: <code>${manifest.map_param}</code> ·
      Archivo: ${manifest.days_back} dias ·
      <span class="ok">${s.ok} OK</span> (${s.cached ?? 0} cache, ${s.downloaded ?? s.ok} new) / <span class="err">${s.fail} fail</span> de ${s.total_candidates} ·
      Generado ${new Date(manifest.generated_at).toLocaleString()}
    `;
  } catch (e) {
    meta.innerHTML = `<span class="err">Error cargando manifest.json: ${e.message}</span>`;
    return;
  }

  try {
    const r = await fetch('frames/log.txt');
    logEl.textContent = await r.text();
  } catch(e) {
    logEl.textContent = '(no log)';
  }

  if (!frames.length) {
    meta.innerHTML += '<br><span class="err">No hay frames disponibles.</span>';
    return;
  }

  slider.max = frames.length - 1;

  function show(i) {
    idx = Math.max(0, Math.min(frames.length - 1, i));
    const f = frames[idx];
    map.src = 'frames/' + f.file;
    const runDate = new Date(f.run);
    const pad = n => String(n).padStart(2, '0');
    const runStr = `${runDate.getUTCFullYear()}-${pad(runDate.getUTCMonth()+1)}-${pad(runDate.getUTCDate())} ${pad(runDate.getUTCHours())}Z`;
    overlay.textContent = `Run ${runStr} · +${f.fh}h`;
    slider.value = idx;
    readout.textContent = `${idx+1} / ${frames.length}`;
    if (lastSamples) renderChart(lastSamples);
  }

  function step() { show((idx + 1) % frames.length); }

  function play() {
    playing = true;
    playBtn.textContent = 'Pause';
    timer = setInterval(step, parseInt(speedEl.value, 10));
  }
  function stop() {
    playing = false;
    playBtn.textContent = 'Play';
    if (timer) { clearInterval(timer); timer = null; }
  }

  playBtn.onclick = () => playing ? stop() : play();
  slider.oninput = e => { stop(); show(parseInt(e.target.value, 10)); };
  speedEl.oninput = e => {
    speedReadout.textContent = `${e.target.value} ms`;
    if (playing) { stop(); play(); }
  };
  clearBtn.onclick = clearPick;

  viewer.addEventListener('click', e => {
    const r = map.getBoundingClientRect();
    const x = e.clientX - r.left;
    const y = e.clientY - r.top;
    if (x < 0 || y < 0 || x > r.width || y > r.height) return;
    pickPoint(x / r.width, y / r.height);
  });

  map.addEventListener('load', updateMarker);
  window.addEventListener('resize', updateMarker);

  document.addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); playing ? stop() : play(); }
    if (e.key === 'ArrowLeft') { stop(); show(idx - 1); }
    if (e.key === 'ArrowRight') { stop(); show(idx + 1); }
  });

  show(0);
})();
</script>
</body>
</html>
